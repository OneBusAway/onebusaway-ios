# Declared here rather than as `scheme:` on the OBAKit target below, purely so the
# scheme's name differs from the target's.
#
# The generated project is `OBAKit.xcodeproj` (see `name:` in
# Apps/Shared/app_shared.yml), and when Xcode opens a project with no saved user
# state it selects the scheme whose name matches the project's. A target-generated
# `OBAKit` scheme therefore won `App` every time a developer regenerated the project
# — which `scripts/generate_project` does routinely, wiping the xcuserdata that
# would otherwise remember the choice. Nothing selects this scheme by name (CI,
# scripts/docs, and CLAUDE.md all use `App`), so only the display name moves.
schemes:
  OBAKit Framework:
    build:
      targets:
        OBAKit: all
    test:
      gatherCoverageData: true

targets:
  OBAKit:
    type: framework
    platform: iOS
    sources:
      - path: "."
        # The vendored BulletinBoard, Hyperconnectivity and MarqueeLabel licenses
        # are shown on the Credits screen (Settings/OBAKit_Credits.plist); keep
        # the raw files out of the bundle.
        excludes:
          - "ThirdParty/BulletinBoard/LICENSE"
          - "ThirdParty/Hyperconnectivity/LICENSE"
          - "ThirdParty/MarqueeLabel/LICENSE"
    dependencies:
      - package: OBAKit
        product: OBAKitCore
      - package: FloatingPanel
      - package: SwiftProtobuf
      - package: OTPKit
      - sdk: HealthKit.framework
    postBuildScripts:
      - path: "../scripts/swiftlint.sh"
        name: Swiftlint
        basedOnDependencyAnalysis: false
    info:
      path: "Info.plist"
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: false
        # Swift-only: no umbrella header and no generated -Swift.h. That header
        # would import OBAKitCore as a Clang module, which a Swift package
        # target doesn't provide.
        SWIFT_INSTALL_OBJC_HEADER: NO
        DEFINES_MODULE: NO
        # Swift language mode, checking level, and MainActor default isolation
        # come from the project-wide base in Apps/Shared/app_shared.yml.
      configs:
          Debug:
            LD_RUNPATH_SEARCH_PATHS:
              - "$(inherited)"
              - "@executable_path/Frameworks"
          Release:
            LD_RUNPATH_SEARCH_PATHS:
              - "$(inherited)"
              - "@executable_path/Frameworks"
