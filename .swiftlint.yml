disabled_rules:
  - function_parameter_count
  - identifier_name
  - line_length
  - private_over_fileprivate
  - statement_position
  - todo
  - trailing_comma
  - type_name

opt_in_rules: # some rules are only opt-in
  # Find all the available rules by running:
  # swiftlint rules

included: # paths to include during linting. `--path` is ignored if present.
  - OBAKit
  - OBAKitCore
  - OBAKitCoreiOS
  - OBAWidget
  - OBAKitWatch
  - WatchApp

excluded: # paths to ignore during linting. Takes precedence over `included`.
  - OBAKitCore/Models/Protobuf/gtfs-realtime.pb.swift

file_length:
  warning: 900
  error: 1100

type_body_length:
  warning: 900
  error: 1000

custom_rules:
  hardcoded_app_name:
    name: "Hardcoded app name"
    # OBAKit/OBAKitCore/OBAKitCoreiOS/OBAWidget/OBAKitWatch/WatchApp are the white-label frameworks and shells — the same code ships
    # as KiedyBus. A brand name baked into a string literal renders the wrong app name.
    # `included:` above already scopes linting to the frameworks, so the app targets
    # under Apps/ remain free to name themselves.
    #
    # `match_kinds: string` covers EVERY string literal, including OBALoc's `value:` and
    # `comment:` arguments — a translator note naming the app trips this too. Naming the
    # *organization* (Open Transit Software Foundation) is legitimate; if you genuinely
    # need the literal, use `// swiftlint:disable:next hardcoded_app_name`.
    # Note the regex is case-sensitive and unanchored: "onebusaway.org" URLs pass.
    regex: "OneBusAway"
    match_kinds:
      - string
    message: "Don't hardcode 'OneBusAway' in a string in a shared framework — use %@ with Bundle.main.appName. This code also ships as KiedyBus."
    severity: error
  epoch_decoded_as_int:
    name: "Epoch value decoded as Int"
    # `Int` is 32 bits on arm64_32 Apple Watches (every watch on watchOS 11; Series
    # 6-8, SE 2, and Ultra 1 on any version). Watch simulators are 64-bit, so a
    # time-valued `Int` decodes fine everywhere except on a customer's wrist.
    # Decode epoch values as Int64 or Date. A key that merely *sounds* temporal
    # (seconds since midnight, an offset) may suppress this with
    # `// swiftlint:disable:next epoch_decoded_as_int` and a reason.
    # Known blind spots — this is a tripwire, not a proof: it cannot see synthesized
    # Codable, it does not match UInt, and it only fires on keys NAMED like a time
    # (it would not have caught ServiceAlert.TimeWindow's `.from` / `.to`). The
    # watchOS device build catches overflowing literals; nothing but review catches
    # an epoch decoded into Int under an innocuous key name.
    included: "OBAKitCore(iOS)?/.*\\.swift"
    regex: 'decode(IfPresent)?\(Int\.self, forKey: \.\w*([Tt]ime|[Dd]ate|[Tt]imestamp)\b'
    message: "Decode epoch values as Int64 or Date — Int is 32 bits on arm64_32 Apple Watches."
    severity: error
  epoch_narrowed_to_int:
    name: "timeIntervalSince1970 narrowed to Int"
    included: "OBAKitCore(iOS)?/.*\\.swift"
    regex: '\bU?Int\((?:[^()]|\([^()]*\))*timeIntervalSince1970'
    message: "Use Int64(…) or UInt64(…) — Int is 32 bits on arm64_32 Apple Watches, and seconds-since-1970 overflows it in 2038."
    severity: error
