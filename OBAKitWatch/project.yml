targets:
  OBAKitWatch:
    type: framework
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      # project.yml is excluded so it does not ship as a resource.
      - path: "."
        excludes: ["project.yml"]
    dependencies:
      - package: OBAKit
        product: OBAKitCore
    # A declared scheme so `xcodebuild -scheme OBAKitWatch` exists on a fresh
    # checkout; XcodeGen writes shared schemes only for targets that ask.
    scheme:
      gatherCoverageData: false
    postBuildScripts:
      - path: "../scripts/swiftlint.sh"
        name: Swiftlint
        basedOnDependencyAnalysis: false
    info:
      path: "Info.plist"
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
    settings:
      base:
        # The step 6 watch widget extension links this framework.
        APPLICATION_EXTENSION_API_ONLY: true
        # Swift-only: no umbrella header and no generated -Swift.h. That header
        # would import OBAKitCore as a Clang module, which a Swift package
        # target doesn't provide.
        SWIFT_INSTALL_OBJC_HEADER: NO
        DEFINES_MODULE: NO
        # Swift language mode, checking level, and MainActor default isolation
        # come from the project-wide base in Apps/Shared/app_shared.yml.
