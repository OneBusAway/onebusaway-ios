name: OBAKitTests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# GitHub macOS Runner images are documented at:
# https://github.com/actions/runner-images?tab=readme-ov-file
# The `xcode-27` image (arm64, public preview) is documented at:
# https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-Readme.md
#
# Performance note (figures observed 2026-06 — a dated snapshot, not an invariant;
# they will drift as the suite, runner images, and Xcode change): the OBAKitTests
# suite itself executes in ~5s locally / ~2-3 min in CI. Everything beyond that is
# CI infrastructure, not the tests:
#   - iOS Simulator runtime prep / first boot (can silently download a multi-GB
#     runtime if the image lags the targeted Xcode point release)
#   - build-for-testing (~5 min)
#   - the test-results upload step (~9 min; see the gated upload step below)
# The steps below make each of those visible and time-boxed so a slow run is
# obvious rather than a mystery 20-minute gap. If you're investigating "slow
# tests", check the step timings first — it is almost never the tests.

jobs:
  # Its own job, not a step inside `build`. As a step it ran before
  # build-for-testing in the same job, so one lint error failed the job and took
  # every test result for that run with it — the two answer different questions
  # and a PR wants both. Parallel jobs also overlap lint with the build instead
  # of serialising them. No `needs:`: neither gates the other, and GitHub still
  # requires both to pass.
  # See https://github.com/OneBusAway/onebusaway-ios/issues/1340
  lint:
    runs-on: xcode-27
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Fail on SwiftLint *errors* (the error-tier rules in .swiftlint.yml), so a
    # type_body_length breach cannot land on main while staying green on GitHub.
    # Warnings annotate via the GitHub reporter but do not fail the job —
    # `--strict` would collapse that split. The Xcode build phase still skips
    # in CI (scripts/swiftlint.sh); this job is the review-visible gate.
    # See https://github.com/OneBusAway/onebusaway-ios/issues/1303
    - name: SwiftLint (errors only)
      run: |
        # Pin via the official portable release so a Homebrew formula bump cannot
        # promote a new error-severity rule and turn main red with no app change
        # (#1340). Bump SWIFTLINT_PIN deliberately after reviewing new rules.
        SWIFTLINT_PIN="0.65.1"
        # GitHub release asset downloads occasionally return a truncated/HTML body
        # (unzip exit 9: "End-of-central-directory signature not found"). Retry
        # and refuse to unzip until the payload looks like a zip.
        for attempt in 1 2 3; do
          curl -fL --retry 3 --retry-delay 2             "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_PIN}/portable_swiftlint.zip"             -o /tmp/swiftlint.zip
          if file /tmp/swiftlint.zip | grep -qi 'Zip archive'; then
            break
          fi
          echo "SwiftLint zip download looked corrupt (attempt ${attempt}); retrying…" >&2
          sleep $((attempt * 2))
        done
        file /tmp/swiftlint.zip | grep -qi 'Zip archive'
        unzip -qo /tmp/swiftlint.zip -d /tmp/swiftlint
        /tmp/swiftlint/swiftlint version | grep -qx "$SWIFTLINT_PIN"
        /tmp/swiftlint/swiftlint lint --reporter github-actions-logging

  build:
    runs-on: xcode-27
    permissions:
      checks: write
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    # DerivedData cache. The key is intentionally narrow: it busts only when the
    # resolved dependency graph, the XcodeGen project specs, or this workflow
    # change. The previous `**/*.yml` glob also matched vendored yml under
    # .build/checkouts and caused needless cache misses (→ full rebuilds).
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: deriveddata-cache
      with:
        path: DerivedData
        key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/Package.resolved', 'project.yml', 'Apps/**/project.yml', '.github/workflows/obakittests.yml') }}
        restore-keys: |
          ${{ runner.os }}-deriveddata-

    # A restore-keys fallback restores DerivedData built against a different
    # dependency graph. Freshly resolved package checkouts then carry newer
    # mtimes than the cached explicit precompiled modules, and swift-frontend
    # hard-errors ("file ... has been modified since the module file was
    # built", exit 65) instead of rebuilding the stale .pcm. Purge the
    # precompiled modules on inexact restores — they rebuild in a fraction of
    # the build step, unlike the rest of DerivedData. (Observed 2026-07-19 on
    # the GRDB 6→7 pin bump, matching the same local failure mode.)
    - name: Purge stale precompiled modules on inexact cache restore
      if: steps.deriveddata-cache.outputs.cache-hit != 'true'
      run: rm -rf DerivedData/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules

    # The `xcode-27` image ships exactly one Xcode (27.0 beta), so this is close to
    # a no-op today — it's here so that if the image ever carries a second Xcode,
    # CI takes the newest one rather than whatever `xcode-select` defaults to.
    # `latest`, not `latest-stable`: the only installed Xcode is a beta, and
    # `latest-stable` filters betas out and fails. Following the image forward is
    # deliberate — the Swift 6 migration needs a compiler of the same generation as
    # local development (docs/swift6-migration-plan.md), which the older pinned
    # Xcode 26.6 was not: it rejected code Xcode 27 accepts and turned main red
    # (see a1244c48). The trade-off is that the toolchain is no longer pinned, so a
    # new beta landing in the image can move the concurrency warning count below.
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: 'latest'

    - name: Install xcodegen
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: brew install xcodegen

    # Make iOS runtime acquisition explicit and time-boxed. An SDK-matched runtime
    # is REQUIRED, not merely preferred: on an older runtime every MainActor class
    # deinit routes through the isolated-deinit back-deployment shim instead of the
    # native runtime entry point, and that path double-freed in TaskLocal teardown
    # under Xcode 26.2's codegen (crash:
    # swift_task_deinitOnExecutorMainActorBackDeploy → BUG_IN_CLIENT_OF_LIBMALLOC,
    # seen 2026-07-16). Xcode 27 no longer emits those implicit isolated deinits,
    # but the 11 explicit `isolated deinit` sites still take the shim. The
    # `xcode-27` image ships only iOS 27 runtimes, so this normally skips.
    - name: Download iOS platform (if needed)
      timeout-minutes: 30
      run: |
        if xcrun simctl runtime list 2>/dev/null | grep -qE "iOS (2[7-9]|[3-9][0-9])[0-9.]*.*\(Ready\)"; then
          echo "An iOS 27+ simulator runtime is already installed; skipping download:"
          xcrun simctl runtime list | grep -E "iOS [0-9]" || true
        else
          echo "No iOS 27+ simulator runtime found; downloading…"
          xcodebuild -downloadPlatform iOS
        fi

    # Diagnostic preflight: logs whether the iOS runtime is actually installed.
    # If `simctl runtime list` doesn't show the targeted iOS version as Ready,
    # the slow runs are paying for a runtime download (see header note).
    - name: Simulator diagnostics
      run: |
        echo "=== Installed simulator runtimes ==="
        xcrun simctl runtime list || true
        echo "=== Available SDKs ==="
        xcodebuild -showsdks || true

    # Pick an iPhone simulator on the NEWEST installed iOS runtime and capture its
    # UDID. Using `id=` in the destination (rather than `name=iPhone 17 Pro`) avoids
    # the "multiple matching destinations" ambiguity. Newest-runtime matters: should
    # the image ever carry a pre-SDK runtime alongside iOS 27, the tests must not
    # land on it — that's the isolated-deinit shim crash described in the download
    # step's note. Booting it here isolates first-boot cost from the test step.
    #
    # The selection itself lives in scripts/resolve_simulator_udid, shared with the
    # commands CLAUDE.md documents so the two cannot drift apart. Note that the
    # script's UDID reaches later steps only because it is written to $GITHUB_ENV
    # here; a plain shell variable would not survive the step boundary.
    - name: Prepare iOS Simulator
      run: |
        set -euo pipefail
        UDID=$(scripts/resolve_simulator_udid)
        echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
        echo "Using simulator UDID: $UDID"
        xcrun simctl boot "$UDID" || true
        xcrun simctl bootstatus "$UDID" || true

    # Needed before the iOS build now: App depends on WatchApp, so building the
    # App scheme compiles the watch stack's simulator slices. Ask the same
    # question the iOS step above asks — is a platform actually installed and
    # Ready — and time-box the download the same way.
    - name: Download watchOS platform (if needed)
      timeout-minutes: 30
      run: |
        if xcrun simctl runtime list 2>/dev/null | grep -qE "watchOS .*\(Ready\)"; then
          echo "A watchOS platform is already installed; skipping download:"
          xcrun simctl runtime list | grep -E "watchOS [0-9]" || true
        else
          echo "No watchOS platform found; downloading…"
          xcodebuild -downloadPlatform watchOS
        fi

    - name: Generate xcodeproj for OneBusAway
      run: scripts/generate_project OneBusAway

    # Build. Output is teed to a log so the concurrency ratchet step can count
    # strict-concurrency warnings (`-quiet` still prints warnings and errors).
    - name: Build OneBusAway
      timeout-minutes: 20
      run: |
        set -o pipefail
        xcodebuild build-for-testing \
          -scheme 'App' \
          -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
          -derivedDataPath DerivedData \
          -quiet \
          | tee xcodebuild-build.log

    # Swift 6 migration ratchet (docs/swift6-migration-plan.md): the number of
    # strict-concurrency warnings may only go down. Enforcing since 2026-07-16.
    # The checked-in baseline (0 as of 2026-07-28) was measured on Xcode 27 beta
    # 3, which is what the `xcode-27` image ships — so CI and local development
    # now count the same code the same way. The baseline is still a ceiling
    # across supported toolchains (the previously pinned Xcode 26.6 counted 37
    # when the baseline was 39), so don't lower it to match whatever a single
    # toolchain reports, or builds on the others fail.
    #
    # This step counts correctly only because the runner starts with an empty
    # compilation cache. Cache hits replay object files WITHOUT re-emitting
    # diagnostics, so a warm cache silently undercounts (locally: 4/12/16/17 for
    # a tree whose true count was 38). The cache lives at
    # COMPILATION_CACHE_CAS_PATH — a machine-global path, NOT the DerivedData
    # directory cached above — so today it is never restored between runs. If
    # anyone ever adds it to actions/cache, this ratchet stops being meaningful:
    # pass COMPILATION_CACHE_CAS_PATH to a scratch dir here, as
    # scripts/measure_concurrency does locally.
    # The baseline is 0: every target, OBAKitTests included, is at zero and
    # additionally locked by SWIFT_WARNINGS_AS_ERRORS_GROUPS in
    # Apps/Shared/app_shared.yml, which escalates the five concurrency
    # diagnostic groups to errors so the compiler — not this grep — is the
    # real gate.
    - name: Concurrency warning ratchet
      run: scripts/concurrency_ratchet xcodebuild-build.log

    # Unit Test. Output is teed to a log so the "Report slowest tests" step can
    # surface per-test timing. `set -o pipefail` keeps xcodebuild's exit code
    # through the pipe so a test failure still fails the step.
    - name: OBAKit Unit Test
      timeout-minutes: 15
      run: |
        set -o pipefail
        xcodebuild test-without-building \
          -only-testing:OBAKitTests \
          -project 'OBAKit.xcodeproj' \
          -scheme 'App' \
          -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
          -derivedDataPath DerivedData \
          -enableCodeCoverage NO \
          -resultBundlePath OBAKitTests.xcresult \
          | tee xcodebuild-test.log

    # watchOS device-architecture compile of every watch target (see the watchOS
    # architecture design spec, §5 "Testing, CI, and staying watch-clean").
    # Permanent, and deliberately a DEVICE build: `Int` is 32 bits on arm64_32
    # Apple Watches, watch simulators on Apple silicon are 64-bit, and an
    # overflowing literal builds green for the simulator and red here. This is
    # the only check in the repo that compiles for a 32-bit Int. It also stops a
    # UIView landing in the portable OBAKitCore/ tree on green iOS CI.
    # The iOS App build never replaces it: that compiles simulator slices only.
    #
    # These two steps sit after `OBAKit Unit Test` so a watchOS compile failure
    # cannot cost a run its test results — the same reasoning the header gives
    # for making lint a separate job. They also run when the tests fail
    # (`if: success() || failure()`), so one run gives a PR both signals.
    #
    - name: Build WatchApp for watchOS devices (arm64 + arm64_32)
      if: success() || failure()
      timeout-minutes: 25
      run: |
        set -o pipefail
        xcodebuild build \
          -project 'OBAKit.xcodeproj' \
          -scheme 'WatchApp' \
          -destination 'generic/platform=watchOS' \
          -derivedDataPath DerivedData \
          CODE_SIGNING_ALLOWED=NO \
          -quiet \
          | tee xcodebuild-watchos.log

    # A compile cannot catch dyld, Info.plist, or embedding failures: the
    # missing-LD_RUNPATH_SEARCH_PATHS crash builds green. `simctl launch` and
    # XcodeBuildMCP both report success for an app dyld kills, so the script
    # asserts liveness after a delay. Unpaired watch simulator; OneBusAway only.
    - name: Watch app launch smoke test
      if: success() || failure()
      timeout-minutes: 15
      run: scripts/watch_smoke_test DerivedData

    # Last, because generating another app replaces the root project.yml and
    # OBAKit.xcodeproj. An app with no watch.yml must generate exactly the
    # project it generated before the watch targets existed.
    - name: KiedyBus generates no watch targets
      if: success() || failure()
      run: |
        set -euo pipefail
        scripts/generate_project KiedyBus
        # Read the *generated* project, not `xcodegen dump`: the watch include
        # is `enable: ${OBA_WATCH}`, which a dump re-evaluates from this
        # shell's environment, where generate_project never set it, so a dump
        # never contains WatchApp and the check could not fail.
        # Capture first, on its own line: a failed listing fails the step
        # under `set -e` instead of reading as "no WatchApp". The one-liner
        # exits 1 (message on stderr) only when WatchApp is present; malformed
        # output makes json.load raise, which also exits non-zero.
        list=$(xcodebuild -list -json -project OBAKit.xcodeproj)
        printf '%s' "$list" | python3 -c 'import json,sys; t=json.load(sys.stdin)["project"]["targets"]; sys.exit("generated project unexpectedly contains WatchApp" if "WatchApp" in t else 0)'
        echo "KiedyBus: no watch targets"

    # The release lane (fastlane/Fastfile) generates with --no-watch until the
    # watch app ships; this is the guard it depends on. Same check as above.
    - name: OneBusAway --no-watch generates no watch targets
      if: success() || failure()
      run: |
        set -euo pipefail
        scripts/generate_project OneBusAway --no-watch
        list=$(xcodebuild -list -json -project OBAKit.xcodeproj)
        printf '%s' "$list" | python3 -c 'import json,sys; t=json.load(sys.stdin)["project"]["targets"]; sys.exit("generated project unexpectedly contains WatchApp" if "WatchApp" in t else 0)'
        echo "OneBusAway --no-watch: no watch targets"

    # Surface the slowest tests in the job summary so a regression in *test*
    # time (vs. infra time) is easy to spot without re-running the investigation.
    #
    # Parses both formats, because the suite spans both: swift-testing's
    # "✔ Test <name> passed after N seconds" covers everything except
    # PolylinePerformanceTests, which stays on XCTest (`measure` has no
    # swift-testing equivalent) and still prints the classic
    # "'-[OBAKitTests.Foo testBar]' passed (N seconds)".
    #
    # The `grep -v` drops swift-testing's run summary, "✔ Test run with N tests
    # in M suites passed after …", which otherwise matches the same pattern and
    # sorts to the top as the slowest "test".
    - name: Report slowest tests
      if: success() || failure()
      run: |
        {
          echo "### Slowest 20 tests"
          echo '```'
          {
            grep -oE "✔ Test .+ passed after [0-9.]+ seconds" xcodebuild-test.log \
              | grep -v '✔ Test run with ' \
              | sed -E "s/✔ Test (.+) passed after ([0-9.]+) seconds/\2  \1/"
            grep -oE "'-\[OBAKitTests\.[^]]+\]' passed \([0-9.]+ seconds\)" xcodebuild-test.log \
              | sed -E "s/'-\[OBAKitTests\.(.+)\]' passed \(([0-9.]+) seconds\)/\2  \1/"
          } | sort -rn | head -20
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY" || true

    # Upload results only when the run fails — parsing/uploading the xcresult
    # bundle takes ~9 min and is wasted effort on green runs. Trade-off: this is
    # the only consumer of the `checks: write` permission, so green runs no longer
    # publish the per-test GitHub Checks summary; the "Report slowest tests" step
    # writes a lighter summary to $GITHUB_STEP_SUMMARY instead. If test-retry flags
    # are ever added, broaden this to `always()` so flaky-but-passing runs still
    # surface which tests retried.
    - uses: slidoapp/xcresulttool@0930e06ae335d8c5e2d2f311ee98d495889a6103 # v3.1.1
      continue-on-error: true
      if: failure()
      with:
         path: OBAKitTests.xcresult
         show-passed-tests: false
         show-code-coverage: false
