name: OBAKitTests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# GitHub macOS Runner images are documented at:
# https://github.com/actions/runner-images?tab=readme-ov-file
# The `xcode-27` image (arm64, public preview) is documented at:
# https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-Readme.md
#
# Four jobs that start together, so wall time is the slowest one, not the sum.
# `build` builds the shipping iOS app and its tests, `test` runs them on a
# runner of its own, `watch` compiles and launches the watch stack and checks
# project generation, and `lint` lints. None `needs:` another (`test` waits for
# `build`'s products itself); GitHub still requires them all to pass.
#
# The build jobs carry Xcode's compilation cache (the CAS) between runs; it is
# off unless COMPILATION_CACHE_ENABLE_CACHING is set. A cached DerivedData
# would not do the same job: a fresh checkout gives every source file a new
# mtime, and the build system recompiles everything. The CAS is keyed by
# content, so it survives a fresh checkout.
#
# If a run is slow, check the step timings first — it is almost never the tests.

# A new commit on a PR cancels that PR's run in progress: macOS runners are
# capped per org, and a superseded run would hold them while the current one
# queues. On main a newer push only replaces a *queued* run, never cancels one
# in progress, so each started run reaches its cache save.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # One place for the CAS location; both build jobs pass it to xcodebuild, and
  # scripts/watch_smoke_test reads it.
  # Inside the workspace: actions/cache rejects paths containing `..`, and
  # only warns when it does, so the cache silently never saves.
  CAS_PATH: ${{ github.workspace }}/CompilationCache

jobs:
  # Its own job so a lint error cannot cost a run its test results (#1340).
  # On Linux, so it does not take one of the org's capped macOS runners. The
  # Linux SwiftLint runs inside the official Swift image: the dynamic binary
  # needs its SourceKit, and the static one silently skips `custom_rules`,
  # which hold this repo's error-tier rules (hardcoded_app_name,
  # epoch_decoded_as_int, …). Checked 2026-10-14 against the macOS portable
  # build: identical output on this tree, the same planted custom-rule error,
  # and the same exit codes.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Fail on SwiftLint *errors* (the error-tier rules in .swiftlint.yml), so a
    # type_body_length breach cannot land on main while staying green on GitHub.
    # Warnings annotate via the GitHub reporter but do not fail the job —
    # `--strict` would collapse that split. The Xcode build phase still skips
    # in CI (scripts/swiftlint.sh); this job is the review-visible gate.
    # See https://github.com/OneBusAway/onebusaway-ios/issues/1303
    - name: SwiftLint (errors only)
      run: |
        # Pin the release so a new error-severity rule cannot turn main red with
        # no app change (#1340). Bump SWIFTLINT_PIN deliberately after reviewing
        # new rules.
        SWIFTLINT_PIN="0.65.1"
        # Swift 6.1.3; pinned by digest like the actions above.
        SWIFT_IMAGE="swift@sha256:6e43114610e161e38ad41636ebcafd6940dc67dfab355eace3a0ca100b2263db"
        # GitHub release asset downloads occasionally return a truncated/HTML body
        # (unzip exit 9: "End-of-central-directory signature not found"). Retry
        # and refuse to unzip until the payload looks like a zip.
        for attempt in 1 2 3; do
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_PIN}/swiftlint_linux_amd64.zip" \
            -o /tmp/swiftlint.zip
          if file /tmp/swiftlint.zip | grep -qi 'Zip archive'; then
            break
          fi
          echo "SwiftLint zip download looked corrupt (attempt ${attempt}); retrying…" >&2
          sleep $((attempt * 2))
        done
        file /tmp/swiftlint.zip | grep -qi 'Zip archive'
        unzip -qo /tmp/swiftlint.zip -d /tmp/swiftlint
        # The reporter prints paths relative to the working directory, so they
        # resolve to PR annotations whatever the mount point.
        docker run --rm \
          -v "$PWD:/src:ro" -v /tmp/swiftlint:/swiftlint:ro -w /src \
          "$SWIFT_IMAGE" \
          sh -c "/swiftlint/swiftlint version | grep -qx '$SWIFTLINT_PIN' && /swiftlint/swiftlint lint --reporter github-actions-logging"

  # Builds the shipping iOS app and its tests, generated with --no-watch exactly
  # as the release lane generates it (fastlane/Fastfile), and hands the test
  # products to the `test` job. The watch stack has its own job below.
  build:
    runs-on: xcode-27
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Spotlight indexing on the host competes with every step here for the
    # runner's three cores, indexing build output nobody will search.
    - name: Turn off Spotlight indexing
      run: sudo mdutil -a -i off

    # The `xcode-27` image ships exactly one Xcode (a 27.x beta), so this is close to
    # a no-op today — it's here so that if the image ever carries a second Xcode,
    # CI takes the newest one rather than whatever `xcode-select` defaults to.
    # `latest`, not `latest-stable`: the only installed Xcode is a beta, and
    # `latest-stable` filters betas out and fails. Following the image forward is
    # deliberate — the Swift 6 migration needs a compiler of the same generation as
    # local development (docs/swift6-migration-plan.md).
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: 'latest'

    # Keys the caches below, which is why Setup Xcode runs first. The runner
    # image version is in the CAS key because compile-cache entries made on one
    # image miss on another, even with the same Xcode build: during an image
    # rollout, runs land on either version, and a cache restored across them
    # was mostly misses. The month is in the key so the cache starts over
    # monthly instead of growing forever.
    - name: Record cache keys
      id: keys
      run: |
        echo "xcode=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
        echo "image=${ImageVersion:?runner image version not set}" >> "$GITHUB_OUTPUT"
        echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

    # The build targets a concrete simulator so it compiles one architecture;
    # the `test` job picks the same device type on its own runner.
    - name: Pick the iOS Simulator
      run: |
        set -euo pipefail
        UDID=$(scripts/resolve_simulator_udid)
        echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
        echo "Using simulator UDID: $UDID"

    # Xcode's compilation cache. Content-addressed, so an older restore cannot
    # poison a build: an entry is found only by the hash of its exact inputs,
    # and anything that changed is a miss and compiles. That makes a
    # `restore-keys` fallback safe, which is what lets each PR start from
    # main's newest cache.
    #
    # Hits need the same absolute checkout and DerivedData paths as the build
    # that filled the cache: a checkout at another path missed on every compile
    # (measured 2026-10-14). GitHub's runners always check out to the same path.
    #
    # Restored here, saved (on main only) at the end of the job. PRs read main's
    # caches but never write their own: per-PR caches would evict main's from
    # the 10 GB repo budget.
    - name: Restore compilation cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.CAS_PATH }}
        key: cas-ios-${{ steps.keys.outputs.xcode }}-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.month }}-${{ github.run_id }}
        restore-keys: cas-ios-${{ steps.keys.outputs.xcode }}-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.month }}-

    # Package checkouts, so the build does not re-clone every dependency. Exact
    # key on the resolved graph; packages live in DerivedData/SourcePackages.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: DerivedData/SourcePackages
        key: spm-${{ hashFiles('Apps/*/Package.resolved') }}

    - name: Install xcodegen
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: brew install xcodegen

    - name: Generate xcodeproj for OneBusAway
      run: scripts/generate_project OneBusAway --no-watch

    - name: Build OneBusAway
      timeout-minutes: 35
      run: |
        xcodebuild build-for-testing \
          -scheme 'App' \
          -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
          -derivedDataPath DerivedData \
          COMPILATION_CACHE_ENABLE_CACHING=YES \
          COMPILATION_CACHE_CAS_PATH="$CAS_PATH" \
          -quiet

    # What a test run needs: the .xctestrun file and the built products it
    # names, all relative to __TESTROOT__, so they run from any directory.
    # Object files, Swift modules and dSYMs stay behind (~370 MB → ~70 MB).
    - name: Package the test products
      run: |
        set -euo pipefail
        cd DerivedData/Build/Products
        tar --exclude='*.o' --exclude='*.swiftmodule' --exclude='*.dSYM' --exclude='*.a' \
          -czf "$RUNNER_TEMP/test-products.tgz" *.xctestrun Debug-iphonesimulator
        ls -lh "$RUNNER_TEMP/test-products.tgz"

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-products-${{ github.run_attempt }}
        path: ${{ runner.temp }}/test-products.tgz
        compression-level: 0
        retention-days: 1

    # main only; see "Restore compilation cache". Saved even when the build
    # fails: the CAS holds only what compiled, so a failure cannot poison it.
    - name: Save compilation cache
      if: (success() || failure()) && github.event_name == 'push'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.CAS_PATH }}
        key: cas-ios-${{ steps.keys.outputs.xcode }}-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.month }}-${{ github.run_id }}

  # Runs the unit tests on a runner of its own. A simulator's first boot keeps
  # a three-core runner saturated for five to eight minutes while its system
  # services start, and anything else on that machine slows to a crawl beside
  # it; booted alongside the build, it tripled the build and the cache
  # restores. So this job starts with the boot and then only waits: for the
  # simulator to settle, and for `build` to upload the products. No `needs:`,
  # which would start the boot only after the build finished.
  test:
    runs-on: xcode-27
    permissions:
      actions: read
      checks: write
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # A simulator's first boot can starve the runner's own agent badly
    # enough that GitHub loses contact with it and fails the job ("The hosted
    # runner lost communication with the server"), which happened to a watch
    # smoke test. The agent's processes, and mDNSResponder, which every
    # network call waits on for DNS, go ahead of the simulator's services.
    - name: Keep the runner agent responsive
      run: |
        # -a: macOS pgrep otherwise skips its own ancestors, which the
        # agent's processes are.
        pids=$(pgrep -a -f 'Runner\.(Listener|Worker)|provjobd|hosted-compute-agent|mDNSResponder' | tr '\n' ' ' || true)
        echo "runner agent: $(ps -o pid=,comm= -p "$(echo ${pids:-0} | tr ' ' ',')" 2>/dev/null | tr '\n' ' ')"
        [ -n "$pids" ] && sudo renice -n -15 -p $pids || echo "::warning::runner agent processes not found"

    - name: Turn off Spotlight indexing
      run: sudo mdutil -a -i off

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: 'latest'

    # resolve_simulator_udid picks an iPhone on the NEWEST installed runtime — an
    # SDK-matched runtime is required, since an older one routes `isolated
    # deinit` through the back-deployment shim that double-freed under Xcode
    # 26.2 (2026-07-16). The UDID reaches later steps only through $GITHUB_ENV.
    # `simctl boot` itself blocks for minutes, so it runs in the background.
    - name: Pick the iOS Simulator and start booting it
      run: |
        set -euo pipefail
        if ! xcrun simctl runtime list 2>/dev/null | grep -qE "iOS (2[7-9]|[3-9][0-9])[0-9.]*.*\(Ready\)"; then
          echo "No iOS 27+ simulator runtime found; downloading…"
          xcodebuild -downloadPlatform iOS
        fi
        UDID=$(scripts/resolve_simulator_udid)
        echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
        echo "Using simulator UDID: $UDID"
        nohup xcrun simctl boot "$UDID" > "$RUNNER_TEMP/simctl-boot.log" 2>&1 &

    # Waits for this attempt's `build` job, then downloads the newest
    # test-products artifact. Newest rather than this attempt's: re-running
    # only the failed jobs re-runs `test` without `build`.
    #
    # This step and the next two raise their own priority (`renice` on the
    # step's shell; what it starts inherits it, still as the runner user):
    # beside the booting simulator's services, each poll and the download
    # and unpack were several times slower.
    - name: Wait for the test products
      timeout-minutes: 40
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        sudo renice -n -10 -p $$ >/dev/null
        jobs_url="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs"
        # A failed poll is retried, not fatal: one transient API error would
        # otherwise fail the job while `build` is still compiling.
        while :; do
          if out=$(curl -fsS --max-time 30 -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/$jobs_url" \
                | jq -r '.jobs[] | select(.name == "build") | "\(.status) \(.conclusion // "-")"' 2>&1); then
            read -r status conclusion <<< "$out" || true
            [ "${status:-}" = completed ] && break
          else
            echo "polling the build job failed, retrying: $out"
          fi
          sleep 5
        done
        if [ "$conclusion" != success ]; then
          echo "::error::the build job finished with '$conclusion'; there is nothing to test"
          exit 1
        fi
        name=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
          --jq '[.artifacts[] | select(.name | startswith("test-products-"))] | sort_by(.name | ltrimstr("test-products-") | tonumber) | last | .name')
        echo "Downloading $name"
        gh run download "${{ github.run_id }}" -n "$name" -D "$RUNNER_TEMP/products-download"
        mkdir -p "$RUNNER_TEMP/products"
        tar -xzf "$RUNNER_TEMP/products-download/test-products.tgz" -C "$RUNNER_TEMP/products"

    - name: Wait for the iOS Simulator
      run: |
        sudo renice -n -10 -p $$ >/dev/null
        xcrun simctl bootstatus "$SIMULATOR_UDID" -b
        cat "$RUNNER_TEMP/simctl-boot.log" || true

    # Output is teed to a log so the "Report slowest tests" step can surface
    # per-test timing; `set -o pipefail` keeps xcodebuild's exit code through
    # the pipe. `-collect-test-diagnostics never`: on any failure xcodebuild
    # otherwise runs `simctl diagnose` and waits on it until this step times
    # out — it cost failing runs ~9 idle minutes, and the per-test failures
    # are already in the log and the result bundle.
    - name: OBAKit Unit Test
      timeout-minutes: 15
      run: |
        set -o pipefail
        sudo renice -n -10 -p $$ >/dev/null
        XCTESTRUN=$(ls "$RUNNER_TEMP"/products/*.xctestrun)
        [ "$(echo "$XCTESTRUN" | wc -l)" -eq 1 ] || { echo "expected one .xctestrun, found: $XCTESTRUN" >&2; exit 1; }
        xcodebuild test-without-building \
          -xctestrun "$XCTESTRUN" \
          -only-testing:OBAKitTests \
          -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
          -enableCodeCoverage NO \
          -collect-test-diagnostics never \
          -resultBundlePath OBAKitTests.xcresult \
          | tee xcodebuild-test.log

    # Surface the slowest tests in the job summary so a regression in *test*
    # time (vs. infra time) is easy to spot without re-running the investigation.
    #
    # Parses both formats, because the suite spans both: swift-testing's
    # "✔ Test <name> passed after N seconds" covers everything except
    # PolylinePerformanceTests, which stays on XCTest (`measure` has no
    # swift-testing equivalent) and still prints the classic
    # "'-[OBAKitTests.Foo testBar]' passed (N seconds)".
    #
    # The `grep -v` drops swift-testing's run summary, "✔ Test run with N tests
    # in M suites passed after …", which otherwise matches the same pattern and
    # sorts to the top as the slowest "test".
    - name: Report slowest tests
      if: success() || failure()
      run: |
        {
          echo "### Slowest 20 tests"
          echo '```'
          {
            grep -oE "✔ Test .+ passed after [0-9.]+ seconds" xcodebuild-test.log \
              | grep -v '✔ Test run with ' \
              | sed -E "s/✔ Test (.+) passed after ([0-9.]+) seconds/\2  \1/"
            grep -oE "'-\[OBAKitTests\.[^]]+\]' passed \([0-9.]+ seconds\)" xcodebuild-test.log \
              | sed -E "s/'-\[OBAKitTests\.(.+)\]' passed \(([0-9.]+) seconds\)/\2  \1/"
          } | sort -rn | head -20
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY" || true

    # Upload results only when the run fails — parsing/uploading the xcresult
    # bundle takes minutes and is wasted effort on green runs. Trade-off: this is
    # the only consumer of the `checks: write` permission, so green runs do not
    # publish the per-test GitHub Checks summary; the "Report slowest tests" step
    # writes a lighter summary to $GITHUB_STEP_SUMMARY instead.
    - uses: slidoapp/xcresulttool@0930e06ae335d8c5e2d2f311ee98d495889a6103 # v3.1.1
      continue-on-error: true
      if: failure()
      with:
         path: OBAKitTests.xcresult
         show-passed-tests: false
         show-code-coverage: false

  # The watch stack: a device-architecture compile and a launch on the
  # simulator, then the project-generation checks. Its own job, so it neither
  # waits on the iOS tests nor can cost them their results.
  watch:
    runs-on: xcode-27
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # A simulator's first boot can starve the runner's own agent badly
    # enough that GitHub loses contact with it and fails the job ("The hosted
    # runner lost communication with the server"), which happened to this job's
    # smoke test. The agent's processes, and mDNSResponder, which every
    # network call waits on for DNS, go ahead of the simulator's services.
    - name: Keep the runner agent responsive
      run: |
        # -a: macOS pgrep otherwise skips its own ancestors, which the
        # agent's processes are.
        pids=$(pgrep -a -f 'Runner\.(Listener|Worker)|provjobd|hosted-compute-agent|mDNSResponder' | tr '\n' ' ' || true)
        echo "runner agent: $(ps -o pid=,comm= -p "$(echo ${pids:-0} | tr ' ' ',')" 2>/dev/null | tr '\n' ' ')"
        [ -n "$pids" ] && sudo renice -n -15 -p $pids || echo "::warning::runner agent processes not found"

    - name: Turn off Spotlight indexing
      run: sudo mdutil -a -i off

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: 'latest'

    - name: Record cache keys
      id: keys
      run: |
        echo "xcode=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
        echo "image=${ImageVersion:?runner image version not set}" >> "$GITHUB_OUTPUT"
        echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

    # Same reasoning as the build job's cache; a separate key because the two
    # jobs compile different slices and would otherwise race to save one key.
    - name: Restore compilation cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.CAS_PATH }}
        key: cas-watch-${{ steps.keys.outputs.xcode }}-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.month }}-${{ github.run_id }}
        restore-keys: cas-watch-${{ steps.keys.outputs.xcode }}-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.month }}-

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: DerivedData/SourcePackages
        key: spm-${{ hashFiles('Apps/*/Package.resolved') }}

    - name: Download watchOS platform (if needed)
      timeout-minutes: 30
      run: |
        if xcrun simctl runtime list 2>/dev/null | grep -qE "watchOS .*\(Ready\)"; then
          echo "A watchOS platform is already installed; skipping download."
        else
          echo "No watchOS platform found; downloading…"
          xcodebuild -downloadPlatform watchOS
        fi

    - name: Install xcodegen
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: brew install xcodegen

    - name: Generate xcodeproj for OneBusAway
      run: scripts/generate_project OneBusAway

    # Deliberately a DEVICE build: `Int` is 32 bits on arm64_32 Apple Watches,
    # watch simulators on Apple silicon are 64-bit, and an overflowing literal
    # builds green for the simulator and red here. This is the only check in
    # the repo that compiles for a 32-bit Int. It also stops a UIView landing in
    # the portable OBAKitCore/ tree on green iOS CI.
    - name: Build WatchApp for watchOS devices (arm64 + arm64_32)
      timeout-minutes: 25
      run: |
        set -o pipefail
        xcodebuild build \
          -project 'OBAKit.xcodeproj' \
          -scheme 'WatchApp' \
          -destination 'generic/platform=watchOS' \
          -derivedDataPath DerivedData \
          COMPILATION_CACHE_ENABLE_CACHING=YES \
          COMPILATION_CACHE_CAS_PATH="$CAS_PATH" \
          CODE_SIGNING_ALLOWED=NO \
          -quiet

    # `simctl runtime list` can report the watchOS runtime Ready before its
    # simulators are usable (each reports `runtime=(null)`), and a fast job
    # can get here first. Wait until a watch simulator resolves.
    - name: Wait for a watch simulator
      if: success() || failure()
      timeout-minutes: 6
      run: |
        until scripts/resolve_watch_simulator_udid >/dev/null 2>&1; do
          echo "watchOS simulators not available yet; waiting…"
          sleep 10
        done
        echo "Watch simulator: $(scripts/resolve_watch_simulator_udid)"

    # A compile cannot catch dyld, Info.plist, or embedding failures: the
    # missing-LD_RUNPATH_SEARCH_PATHS crash builds green. `simctl launch` and
    # XcodeBuildMCP both report success for an app dyld kills, so the script
    # asserts liveness after a delay.
    - name: Watch app launch smoke test
      if: success() || failure()
      timeout-minutes: 15
      run: scripts/watch_smoke_test DerivedData

    # main only; see the build job's "Restore compilation cache".
    - name: Save compilation cache
      if: (success() || failure()) && github.event_name == 'push'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.CAS_PATH }}
        key: cas-watch-${{ steps.keys.outputs.xcode }}-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.month }}-${{ github.run_id }}

    # Last, because generating another app replaces the root project.yml and
    # OBAKit.xcodeproj. An app with no watch.yml must generate exactly the
    # project it generated before the watch targets existed.
    - name: KiedyBus generates no watch targets
      if: success() || failure()
      run: |
        scripts/generate_project KiedyBus
        scripts/assert_no_watch_target

    # Same assertion, for the flag the release lane depends on.
    - name: OneBusAway --no-watch generates no watch targets
      if: success() || failure()
      run: |
        scripts/generate_project OneBusAway --no-watch
        scripts/assert_no_watch_target
