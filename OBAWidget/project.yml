targets:
  OBAWidget:
    type: app-extension
    platform: iOS
    sources: ["."]
    dependencies:
      - package: OBAKit
        product: OBAKitCore
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    entitlements:
      path: OBAWidget.entitlements
    info:
      path: Info.plist
      properties:
        # An extension's version must match its containing app's.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

